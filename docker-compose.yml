version: '3.8'

services:
  # Redis service for BullMQ queues, caching, and event pub/sub
  redis:
    image: redis:7-alpine
    container_name: pharmacy-admin-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_admin_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Admin Backend API (Express + Prisma + BullMQ)
  admin-api:
    build:
      context: .
      dockerfile: apps/admin-api/Dockerfile
    container_name: pharmacy-admin-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - REDIS_URL=redis://redis:6379
      - MAIN_SITE_URL=${MAIN_SITE_URL}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3001}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      redis:
        condition: service_healthy

  # Admin Web Frontend (Next.js 15)
  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    container_name: pharmacy-admin-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api/v1
      - NEXT_PUBLIC_APP_NAME="Pharmico Admin"
      - NEXT_PUBLIC_THEME_VARIANT=pharmacy-green
    depends_on:
      - admin-api

volumes:
  redis_admin_data:
    driver: local
